version: '3.8'

services:
  unimatch:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg://unimatch:unimatch_dev@postgres:5432/unimatch_dev
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unimatch_dev
      POSTGRES_USER: unimatch
      POSTGRES_PASSWORD: unimatch_dev
    ports:
      - "5432:5432"
    volumes:
      - unimatch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  unimatch_postgres_data:
