name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: CI/CD Pipeline - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Generate coverage report
        run: |
          python -m pytest tests/ --cov=src/unimatch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  build-artifact:
    name: CI/CD Pipeline - Build Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifact
        run: |
          mkdir -p artifact
          cp -r src artifact/
          cp requirements.txt artifact/
          cp pyproject.toml artifact/
          echo "Build date: $(date)" > artifact/build-info.txt
          echo "Commit: ${{ github.sha }}" >> artifact/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unimatch-artifact
          path: artifact/
          retention-days: 30
