[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unimatch"
version = "1.0.0"
requires-python = ">=3.12"
readme = "README.md"
description = "UniMatch: School-Based University Eligibility Recommender for South African Matriculants"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5.0,<6",
    "chromadb==1.0.13",
    "google-genai==1.31.0",
    "rank-bm25==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=4.0",
    "httpx>=0.27,<1",
]

[project.scripts]
unimatch = "unimatch.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["src/unimatch"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 0
